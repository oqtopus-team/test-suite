name: E2E Test

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        description: "Git ref of oqtopus-team/test-suite to check out (defaults to the SHA of the triggering event)"
      signup_blocked:
        type: string
        required: false
        description: "Set to 'true' to run the signup-blocked check (defaults to vars.E2E_SIGNUP_BLOCKED)"
      device_id:
        type: string
        required: false
        description: "Device ID to target (defaults to vars.DEVICE_ID)"
    secrets:
      USER_API_ENDPOINT:
        required: true
      Q_API_TOKEN:
        required: false
      E2E_BASE_URL:
        required: true
      E2E_EMAIL:
        required: true
      E2E_PASSWORD:
        required: true
      E2E_TOTP_SECRET:
        required: true
  workflow_dispatch:
  pull_request:

jobs:
  run-e2e-test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./e2e
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
      USER_API_ENDPOINT: ${{ secrets.USER_API_ENDPOINT }}
      Q_API_TOKEN: ${{ secrets.Q_API_TOKEN }}
      E2E_SIGNUP_BLOCKED: ${{ inputs.signup_blocked || vars.E2E_SIGNUP_BLOCKED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          repository: oqtopus-team/test-suite
          ref: ${{ inputs.ref || github.sha }}

      - name: Show target device
        run: echo "DEVICE_ID=${{ inputs.device_id || vars.DEVICE_ID }}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Browsers come from the Playwright CDN and are cached, so this job does
      # not depend on the Ubuntu apt mirrors for anything it strictly needs.
      # (`--with-deps` used to hang for ~10 min when *.ubuntu.com failed to resolve.)
      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            npx playwright install chromium && exit 0
            echo "::warning::playwright install failed (attempt $i/3)"
            sleep $((i * 10))
          done
          exit 1

      # The runner image already ships every shared library Chromium needs, so
      # install-deps (apt) only runs when ldd actually reports a missing one.
      - name: Install missing shared libraries
        timeout-minutes: 5
        run: |
          missing=0
          bins=$(find ~/.cache/ms-playwright -maxdepth 3 -type f \
            \( -name chrome -o -name chrome-headless-shell \) -perm -u+x)
          if [ -z "$bins" ]; then
            echo "::error::No Chromium binary found under ~/.cache/ms-playwright"
            exit 1
          fi
          for bin in $bins; do
            dir=$(dirname "$bin")
            out=$(LD_LIBRARY_PATH="$dir" ldd "$bin" "$dir"/*.so 2>/dev/null | grep 'not found' | sort -u || true)
            if [ -n "$out" ]; then
              echo "Missing libraries for $bin:"; echo "$out"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "All shared libraries are present; skipping install-deps."
            exit 0
          fi
          for i in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "::warning::playwright install-deps failed (attempt $i/3)"
            sleep $((i * 10))
          done
          exit 1

      # Fonts only affect how failure screenshots/traces render; the tests
      # assert on DOM text, not pixels. Fetching them is therefore best effort
      # and never fails the job if the apt mirrors are unreachable.
      - name: Install fonts (best effort)
        timeout-minutes: 4
        continue-on-error: true
        env:
          # Font packages Playwright's `install-deps` pulls in on Ubuntu
          # (the "tools" list in playwright-core's nativeDeps).
          FONT_PACKAGES: >-
            fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf
            fonts-freefont-ttf fonts-liberation fonts-noto-color-emoji
            fonts-unifont xfonts-cyrillic xfonts-scalable
        run: |
          fonts="$FONT_PACKAGES"
          apt_opts="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2; do
            if timeout 90 sudo apt-get $apt_opts update -qq \
              && timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get $apt_opts install -y --no-install-recommends $fonts; then
              exit 0
            fi
            echo "::warning::Font installation failed (attempt $i/2)"
            sleep 10
          done
          echo "::warning::Fonts could not be installed; continuing without them (only failure screenshots are affected)."
          exit 1

      - name: Verify required secrets
        run: |
          : "${E2E_BASE_URL:?E2E_BASE_URL is not set}"
          : "${E2E_EMAIL:?E2E_EMAIL is not set}"
          : "${E2E_PASSWORD:?E2E_PASSWORD is not set}"
          : "${E2E_TOTP_SECRET:?E2E_TOTP_SECRET is not set}"
          : "${USER_API_ENDPOINT:?USER_API_ENDPOINT is not set}"
          [ -n "${Q_API_TOKEN}" ] || echo "::warning::Q_API_TOKEN is not set"

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results
          retention-days: 7
