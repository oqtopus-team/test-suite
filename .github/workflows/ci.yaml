name: CI

on:
  push:
    # If you are using a develop branch, include it here (e.g., [main, develop]).
    branches: [main]
  pull_request:
    # If you are using a develop branch, include it here as well.
    branches: [main]

# Cancel outdated workflows for the same PR or branch
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-python: true

      - name: Set up Python
        run: uv python install

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Detect changed markdown files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.ref }}"
            git fetch --no-tags --depth=1 origin "$base_ref"
            changed=$(git diff --name-only "origin/$base_ref...HEAD")
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '\.md$'; then
            echo "md=true" >> "$GITHUB_OUTPUT"
          else
            echo "md=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Documentation Lint
        if: steps.changes.outputs.md == 'true'
        run: make docs-lint

      - name: Build documentation
        run: make docs-build
