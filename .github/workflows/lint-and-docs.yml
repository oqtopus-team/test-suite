name: Lint & Docs

on:
  push:
    # If you are using a develop branch, include it here (e.g., [main, develop]).
    branches: [main]
  pull_request:
    # If you are using a develop branch, include it here as well.
    branches: [main]

# Cancel outdated workflows for the same PR or branch
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-python: true

      - name: Set up Python
        run: uv python install

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Documentation Lint
        run: make docs-lint

      - name: Build documentation
        run: make docs-build
